<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gongsu-logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d28d9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="공수성가" />
    <meta name="description" content="공수성가 투자 로그와 매매 신호를 모바일 앱처럼 확인합니다." />
    <title>공수성가 | 투자 로그</title>
    <!-- Pretendard 폰트를 렌더링 차단 없이 비동기로 로드해 첫 화면(스피너) 표시를 앞당긴다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
      />
    </noscript>
    <style>
      /* 초기 로딩이 지연될 때만 보여주는 로딩 화면. React가 마운트되면 #root가 교체되며 사라진다. */
      .app-loading {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        color: #6b7280;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        z-index: 9999;
      }
      .app-loading.visible {
        display: flex;
      }
      .app-loading__logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        animation: app-loading-pulse 1.6s ease-in-out infinite;
      }
      .app-loading__spinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(34, 136, 238, 0.2);
        border-top-color: #2288ee;
        animation: app-loading-spin 0.8s linear infinite;
      }
      .app-loading__text {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.01em;
      }
      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes app-loading-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-color-scheme: dark) {
        .app-loading {
          background: #08111f;
          color: #94a3b8;
        }
        .app-loading__spinner {
          border-color: rgba(90, 169, 244, 0.22);
          border-top-color: #5aa9f4;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loading__logo,
        .app-loading__spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loading" class="app-loading" role="status" aria-live="polite">
        <img class="app-loading__logo" src="/gongsu-logo.png" alt="공수성가" width="64" height="64" />
        <div class="app-loading__spinner" aria-hidden="true"></div>
        <p class="app-loading__text" id="app-loading-text">불러오는 중…</p>
      </div>
    </div>
    <script>
      // 로딩 버퍼/오류 감지: 즉시 로드가 안 될 때만 스피너를 보여주고 자동으로 재시도한다.
      (function () {
        var SHOW_LOADING_MS = 1200
        var AUTO_RELOAD_MS = 10000
        function currentLoader() {
          return document.getElementById('app-loading')
        }
        function showLoading(message) {
          var loader = currentLoader()
          if (!loader) return // React가 이미 마운트되어 #root가 교체됨
          var text = document.getElementById('app-loading-text')
          if (message && text) text.textContent = message
          loader.classList.add('visible')
        }
        function reloadIfStillLoading() {
          var loader = document.getElementById('app-loading')
          if (!loader) return // React가 이미 마운트되어 #root가 교체됨
          showLoading('연결이 지연되어 다시 불러오는 중…')
          window.setTimeout(function () {
            if (currentLoader()) window.location.reload()
          }, 250)
        }
        var showTimer = setTimeout(function () {
          showLoading()
        }, SHOW_LOADING_MS)
        var reloadTimer = setTimeout(reloadIfStillLoading, AUTO_RELOAD_MS)
        // 메인 스크립트 등 리소스 로드 실패 감지
        window.addEventListener(
          'error',
          function (event) {
            var target = event && event.target
            if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
              clearTimeout(showTimer)
              clearTimeout(reloadTimer)
              reloadIfStillLoading()
            }
          },
          true,
        )
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
