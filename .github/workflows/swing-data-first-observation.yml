name: Data-first swing paper collection

on:
  schedule:
    - cron: "15 14,15,19,20 * * 1-5"
    - cron: "20 22,23 * * 1-5"
    - cron: "15 12,13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gap-go-observations
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data reader
        run: pip install --disable-pip-version-check yfinance
      - name: Record archived inputs and paired paper trades
        run: python scripts/record_data_first_candidates.py
      - name: Commit private research records
        run: |
          git add data/history/swing-research
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect data-first swing paper observations"
          BRANCH="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
