name: Data-first swing paper collection

on:
  schedule:
    - cron: "15 14,15,19,20 * * 1-5"
    - cron: "20 22,23 * * 1-5"
    - cron: "15 12,13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gap-go-observations
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data reader
        run: pip install --disable-pip-version-check yfinance
      - name: Load latest published data
        run: bash scripts/publish_live_data.sh --overlay
      - name: Record archived inputs and paired paper trades
        run: python scripts/record_data_first_candidates.py
      - name: Commit private research records
        run: |
          git add data/history/swing-research
          if git diff --cached --quiet; then
            exit 0
          fi
          bash scripts/publish_live_data.sh "Collect data-first swing paper observations"
