name: Web data refresh

on:
  schedule:
    # Daily valuation refresh + earnings D-1 emails: Monday–Sunday 00:00 KST (UTC 15:00).
    - cron: "0 15 * * *"
    # Weekly market trends + universe report: Monday 00:00 KST (Sunday 15:00 UTC).
    - cron: "0 15 * * 0"
  workflow_dispatch:
    inputs:
      refresh_scope:
        description: "Refresh scope"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - analysis
          - stock-universe
          - valuation
          - technical
          - market-trends
          - market-events
      send_notifications:
        description: "Send notification emails"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      scheduled_publish_at:
        description: "UTC ISO time to wait until before notifications, commit, and deploy"
        required: false
        default: ""
      refresh_tickers:
        description: "Comma-separated tickers to force into this refresh"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: web-data-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MARKET_TREND_MODEL: ${{ secrets.GROQ_MARKET_TREND_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAX_REFRESH_UNIVERSE: "200"
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
      EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
      NOTIFICATION_UNSUBSCRIBE_SECRET: ${{ secrets.NOTIFICATION_UNSUBSCRIBE_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync branch with latest remote
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Snapshot previous web caches
        run: |
          cp web/public/api/stocks.json "$RUNNER_TEMP/stocks.before-refresh.json" 2>/dev/null || echo '{"rows":[]}' > "$RUNNER_TEMP/stocks.before-refresh.json"
          cp web/public/api/technical.json "$RUNNER_TEMP/technical.before-refresh.json" 2>/dev/null || echo '{"rows":{}}' > "$RUNNER_TEMP/technical.before-refresh.json"
          cp web/public/api/trade-logs.json "$RUNNER_TEMP/trade-logs.before-refresh.json" 2>/dev/null || echo '{"rows":[]}' > "$RUNNER_TEMP/trade-logs.before-refresh.json"
          cp data/search_universe.json "$RUNNER_TEMP/search-universe.before-refresh.json" 2>/dev/null || echo '{"rows":[]}' > "$RUNNER_TEMP/search-universe.before-refresh.json"

      - name: Resolve refresh tasks
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PUBLISH_AT=""
            SEND_NOTIFICATIONS="true"
            # Exact match first: weekly `0 15 * * 0` must not fall through to daily valuation.
            if [ "${{ github.event.schedule }}" = "0 15 * * 0" ]; then
              TASKS="stock-universe market-trends"
              FORCE_REFRESH="true"
            else
              TASKS="valuation"
              FORCE_REFRESH="false"
            fi
          else
            case "${{ inputs.refresh_scope }}" in
            all) TASKS="stock-universe valuation technical market-trends market-events" ;;
            analysis) TASKS="valuation technical" ;;
            stock-universe) TASKS="stock-universe" ;;
            valuation) TASKS="valuation" ;;
            technical) TASKS="technical" ;;
            market-trends) TASKS="stock-universe market-trends" ;;
            market-events) TASKS="market-events" ;;
            *) TASKS="stock-universe valuation technical market-trends market-events" ;;
            esac
            SEND_NOTIFICATIONS="${{ inputs.send_notifications || 'true' }}"
            RAW_PUBLISH_AT="${{ inputs.scheduled_publish_at || '' }}"
            if [ "$RAW_PUBLISH_AT" = "immediate" ]; then
              PUBLISH_AT=""
            elif [ -n "$RAW_PUBLISH_AT" ]; then
              PUBLISH_AT="$RAW_PUBLISH_AT"
            else
              PUBLISH_AT="$(python -c 'from datetime import datetime, timedelta, timezone; now = datetime.now(timezone.utc); publish_at = now.replace(minute=0, second=0, microsecond=0) + timedelta(hours=1); print(publish_at.isoformat(timespec="seconds").replace("+00:00", "Z") if now.minute >= 50 else "")')"
            fi
            FORCE_REFRESH="false"
          fi
          echo "REFRESH_TASKS=$TASKS" >> "$GITHUB_ENV"
          echo "SEND_NOTIFICATIONS=$SEND_NOTIFICATIONS" >> "$GITHUB_ENV"
          echo "WEB_REFRESH_PUBLISH_AT=$PUBLISH_AT" >> "$GITHUB_ENV"
          echo "FORCE_REFRESH=$FORCE_REFRESH" >> "$GITHUB_ENV"
          echo "REFRESH_TICKERS=${{ inputs.refresh_tickers || '' }}" >> "$GITHUB_ENV"
          echo "Resolved refresh tasks: $TASKS"
          echo "Send notifications: $SEND_NOTIFICATIONS"
          echo "Publish at: ${PUBLISH_AT:-immediate}"

      - name: Sync watchlist type maps
        run: python scripts/sync_watchlist_type_maps.py

      - name: Skip fresh scheduled refresh
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          if os.environ.get("FORCE_REFRESH") == "true":
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write("SKIP_REFRESH=false\n")
              print("Scheduled refresh forced by FORCE_REFRESH.")
              raise SystemExit(0)

          # Only skip when every analysis cache scheduled to refresh this run is
          # already fresh. Valuation refreshes daily while technical refreshes
          # every two hours, so judging by technical alone made the daily
          # valuation run skip whenever technical had just updated, leaving
          # valuation a day stale.
          cache_paths = {
              "valuation": Path("web/public/api/valuation.json"),
              "technical": Path("web/public/api/technical.json"),
          }
          refresh_tasks = os.environ.get("REFRESH_TASKS", "").split()
          analysis_tasks = [task for task in refresh_tasks if task in cache_paths]
          skip = bool(analysis_tasks)
          for task in analysis_tasks:
              path = cache_paths[task]
              fresh = False
              if path.exists():
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  meta = payload.get("meta", {}) if isinstance(payload, dict) else {}
                  raw_updated_at = meta.get("lastSuccessfulRun") or meta.get("updatedAt")
                  if raw_updated_at:
                      updated_at = datetime.fromisoformat(str(raw_updated_at).replace("Z", "+00:00"))
                      age_seconds = (datetime.now(timezone.utc) - updated_at.astimezone(timezone.utc)).total_seconds()
                      fresh = age_seconds < 90 * 60
                      print(f"{task} cache age: {age_seconds:.0f}s (fresh={fresh})")
                  else:
                      print(f"{task} cache has no timestamp; treating as stale.")
              else:
                  print(f"{task} cache missing; treating as stale.")
              skip = skip and fresh
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SKIP_REFRESH={'true' if skip else 'false'}\n")
          print("Scheduled refresh skipped because every scheduled cache is fresh." if skip else "Scheduled refresh will run.")
          PY

      - name: Refresh web caches
        if: ${{ env.SKIP_REFRESH != 'true' }}
        run: python scripts/refresh_web_caches.py $REFRESH_TASKS

      - name: Update trade logs
        if: ${{ env.SKIP_REFRESH != 'true' && contains(env.REFRESH_TASKS, 'technical') }}
        env:
          PREVIOUS_STOCKS_PATH: ${{ runner.temp }}/stocks.before-refresh.json
          PREVIOUS_TECHNICAL_PATH: ${{ runner.temp }}/technical.before-refresh.json
        run: python scripts/record_web_api_logs.py --trade-logs-only $REFRESH_TASKS

      - name: Report operational scale metrics
        if: ${{ env.SKIP_REFRESH != 'true' }}
        continue-on-error: true
        run: python scripts/report_operational_scale.py

      - name: Notify admins if market trend analysis fell back
        if: ${{ env.SKIP_REFRESH != 'true' && contains(env.REFRESH_TASKS, 'market-trends') }}
        continue-on-error: true
        run: |
          # A Groq failure is swallowed into a signal-only fallback, so the run stays green.
          REASON="$(python -c 'import json; print((json.load(open("web/public/api/market-trends.json")).get("meta") or {}).get("failedReason") or "")')"
          if [ -z "$REASON" ]; then
            echo "Market trend LLM analysis succeeded."
            exit 0
          fi
          echo "Market trend LLM analysis failed: $REASON"
          python scripts/web_refresh_notifications.py admin-failure --message "주간 시장 트렌드 LLM 분석이 실패해 내부 가격·기술 모멘텀 신호로 대체됐습니다. GROQ_API_KEY가 만료·폐기되지 않았는지 확인해 주세요. 사유: $REASON"

      - name: Wait until scheduled publish time
        if: ${{ env.SKIP_REFRESH != 'true' && env.WEB_REFRESH_PUBLISH_AT != '' }}
        run: |
          python - <<'PY'
          import os
          import time
          from datetime import datetime, timezone

          raw_publish_at = os.environ.get("WEB_REFRESH_PUBLISH_AT", "")
          publish_at = datetime.fromisoformat(raw_publish_at.replace("Z", "+00:00")).astimezone(timezone.utc)
          wait_seconds = max(0, int((publish_at - datetime.now(timezone.utc)).total_seconds()))
          print(f"Waiting {wait_seconds}s until scheduled publish time: {raw_publish_at}")
          if wait_seconds:
              time.sleep(wait_seconds)
          PY

      - name: Send opinion change emails
        if: ${{ env.SKIP_REFRESH != 'true' && env.SEND_NOTIFICATIONS == 'true' && contains(env.REFRESH_TASKS, 'technical') }}
        run: python scripts/web_refresh_notifications.py opinion --previous "$RUNNER_TEMP/stocks.before-refresh.json" --previous-trade-logs "$RUNNER_TEMP/trade-logs.before-refresh.json"

      - name: Send Nasdaq peak emails
        if: ${{ env.SKIP_REFRESH != 'true' && env.SEND_NOTIFICATIONS == 'true' && contains(env.REFRESH_TASKS, 'technical') }}
        run: python scripts/web_refresh_notifications.py nasdaq-peak

      - name: Send Nasdaq warn emails
        if: ${{ env.SKIP_REFRESH != 'true' && env.SEND_NOTIFICATIONS == 'true' && contains(env.REFRESH_TASKS, 'technical') }}
        run: python scripts/web_refresh_notifications.py nasdaq-warn

      - name: Send earnings D-1 emails
        if: ${{ env.SKIP_REFRESH != 'true' && env.SEND_NOTIFICATIONS == 'true' && contains(env.REFRESH_TASKS, 'valuation') }}
        run: python scripts/web_refresh_notifications.py earnings

      - name: Send weekly trend report emails
        if: ${{ env.SKIP_REFRESH != 'true' && env.SEND_NOTIFICATIONS == 'true' && contains(env.REFRESH_TASKS, 'market-trends') }}
        run: python scripts/web_refresh_notifications.py weekly-trend

      - name: Send stock universe update email
        if: ${{ env.SKIP_REFRESH != 'true' && env.SEND_NOTIFICATIONS == 'true' && contains(env.REFRESH_TASKS, 'stock-universe') }}
        run: python scripts/web_refresh_notifications.py stock-universe-report --previous "$RUNNER_TEMP/search-universe.before-refresh.json"

      - name: Notify admins for market event review
        if: ${{ env.SKIP_REFRESH != 'true' && env.SEND_NOTIFICATIONS == 'true' && contains(env.REFRESH_TASKS, 'market-events') }}
        run: python scripts/web_refresh_notifications.py market-events-review

      - name: Commit refreshed caches and notification state
        if: ${{ env.SKIP_REFRESH != 'true' }}
        run: |
          # Stage first: each day starts a brand new snapshot file, and plain
          # `git diff` cannot see files that are not tracked yet.
          git add data/cache data/history data/search_universe.json web/public/api
          if git diff --cached --quiet -- data/cache data/history data/search_universe.json web/public/api; then
            echo "No cache changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update scheduled web data caches"
          BRANCH="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase -X theirs "origin/$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push failed; retrying after syncing remote changes (attempt $attempt/3)."
            sleep $((attempt * 5))
          done
          echo "Failed to push refreshed caches after retries."
          exit 1

      - name: Record stock-level operation logs
        if: ${{ env.SKIP_REFRESH != 'true' }}
        continue-on-error: true
        env:
          PREVIOUS_STOCKS_PATH: ${{ runner.temp }}/stocks.before-refresh.json
          PREVIOUS_TECHNICAL_PATH: ${{ runner.temp }}/technical.before-refresh.json
        run: python scripts/record_web_api_logs.py --skip-trade-log-update $REFRESH_TASKS

      - name: Verify production auth config
        if: ${{ env.SKIP_REFRESH != 'true' }}
        id: verify-auth-config
        continue-on-error: true
        run: |
          # Cache-only pushes skip the Vite rebuild; still confirm login config stayed intact.
          sleep 20
          python scripts/verify_web_auth_config.py

      - name: Notify admins if auth config is missing
        if: ${{ env.SKIP_REFRESH != 'true' && steps.verify-auth-config.outcome == 'failure' }}
        continue-on-error: true
        run: >
          python scripts/web_refresh_notifications.py admin-failure
          --message "프로덕션 웹 번들에 Supabase 로그인 설정이 없습니다.
          일반 사용자는 로그인할 수 없습니다. Vercel에서 Use existing Build Cache를 끄고 Redeploy 한 뒤,
          VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY가 Production에 있는지 확인해 주세요.
          site=${{ secrets.WEB_APP_URL }}"

      - name: Notify admins on failure
        if: failure()
        continue-on-error: true
        run: python scripts/web_refresh_notifications.py admin-failure --message "Web data refresh workflow failed. Check the latest GitHub Actions run."
