name: Recover web refresh runner outages

on:
  workflow_run:
    workflows: [Web data refresh]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Inspect a refresh run without rerunning it"
        required: true
        type: string

permissions:
  actions: write
  checks: read

concurrency:
  group: web-refresh-recovery-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJSON('["failure", "cancelled", "timed_out"]'), github.event.workflow_run.conclusion)
    # Recovery must not depend on the same Ubuntu runner pool as refresh.
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Retry only confirmed runner acquisition failures
        uses: actions/github-script@v8
        env:
          INSPECT_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const dryRun = context.eventName === 'workflow_dispatch';
            const runId = Number(dryRun ? process.env.INSPECT_RUN_ID : context.payload.workflow_run.id);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              throw new Error('A positive workflow run ID is required.');
            }
            const params = { ...context.repo, run_id: runId };
            const { data: run } = await github.rest.actions.getWorkflowRun(params);
            const report = async message => {
              core.info(message);
              await core.summary.addHeading('Web refresh recovery').addRaw(message).write();
            };
            if (run.path !== '.github/workflows/web-data-refresh.yml' || run.head_branch !== 'main' ||
                !['schedule', 'workflow_dispatch'].includes(run.event)) {
              await report('Skipped: this is not a main-branch web refresh run.');
              return;
            }
            if (run.status !== 'completed' || !['failure', 'cancelled', 'timed_out'].includes(run.conclusion)) {
              await report('Skipped: the run is successful or already being retried.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...params, attempt_number: run.run_attempt, per_page: 100
            });
            const refresh = jobs.find(job => job.name === 'refresh');
            if (!refresh || refresh.runner_name || (refresh.steps || []).length > 0) {
              await report('Skipped: refresh already started; automatic replay could repeat side effects.');
              return;
            }
            const checkRunId = Number(refresh.check_run_url.split('/').pop());
            const annotations = await github.paginate(github.rest.checks.listAnnotations, {
              ...context.repo, check_run_id: checkRunId, per_page: 100
            });
            if (!annotations.some(item => item.message.includes('The job was not acquired by Runner of type hosted'))) {
              await report('Skipped: no confirmed hosted runner acquisition failure (including manual cancellation).');
              return;
            }
            core.info(`Confirmed runner acquisition failure: run ${runId}, attempt ${run.run_attempt}.`);
            if (run.run_attempt >= 3) {
              await report('Retry limit reached: at most two automatic retries per refresh run.');
              return;
            }
            if (Date.now() - Date.parse(run.updated_at) > 2 * 60 * 60 * 1000) {
              await report('Skipped: this failure is more than two hours old.');
              return;
            }
            if (dryRun) {
              await report(`Inspection only: run ${runId} qualifies for automatic recovery. No rerun requested.`);
              return;
            }
            await github.rest.actions.reRunWorkflow(params);
            await report(`Requested attempt ${run.run_attempt + 1} for ${run.html_url}; original inputs are preserved.`);
