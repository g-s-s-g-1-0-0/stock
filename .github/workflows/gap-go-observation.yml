name: Gap-and-go research collection

on:
  schedule:
    # Both DST and standard-time UTC windows. A late start still records that
    # slot's New York session, then fills the 10:00–11:00 paper trade if the
    # minute bars are already available.
    - cron: "20,25,30 13,14 * * 1-5"
    - cron: "0,5,10 14,15 * * 1-5"
    - cron: "5,10,15 20,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gap-go-observations
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      GAP_GO_SCHEDULE: ${{ github.event.schedule }}
      SWING_RESEARCH_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collection dependency
        run: pip install --disable-pip-version-check yfinance
      - name: Load latest published data
        run: bash scripts/publish_live_data.sh --overlay
      - name: Record research-only observations
        run: python scripts/record_gap_go_observations.py
      - name: Commit internal research data
        run: |
          git add data/history/gap-go data/history/swing-research
          if git diff --cached --quiet; then
            exit 0
          fi
          bash scripts/publish_live_data.sh "Collect gap-and-go and swing research observations"
